version: 0.0
os: linux

files:
  # Copy application files except appspec.yml
  - source: app/    # Assuming your app files are inside the `app/` directory
    destination: /home/testcase/public_html/
    file_exists_behavior: OVERWRITE

  # Copy deployment scripts separately
  - source: scripts/
    destination: /home/testcase/deploy-temp/scripts/
    file_exists_behavior: OVERWRITE

permissions:
  - object: /home/testcase/deploy-temp/scripts/
    pattern: "*.sh"
    owner: root
    group: root
    mode: 755  # Ensure execute permission

hooks:
  ApplicationStart:
    - location: scripts/deploy_staging.sh
      runas: testcase
      timeout: 300

  AfterInstall:
    - location: scripts/wait_for_approval.sh
      runas: root
      timeout: 300

  ValidateService:
    - location: scripts/deploy_production.sh
      runas: etpmc
      timeout: 300
