version: 0.0
os: linux
files:
  - source: /
    destination: /tmp/codedeploy-temp
  - source: scripts/
    destination: /tmp/codedeploy-temp/scripts/
file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: /tmp/codedeploy-temp/scripts/wait_for_approval.sh
      runas: root
      timeout: 300

  AfterInstall:
    - location: /tmp/codedeploy-temp/scripts/deploy_staging.sh
      runas: testcase
      timeout: 300

  ApplicationStart:
    - location: /tmp/codedeploy-temp/scripts/deploy_production.sh
      runas: etpmc
      timeout: 300
