version: 0.0
os: linux

files:
  - source: /
    destination: /home/testcase/deploy-temp

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStart:
    - location: scripts/deploy_staging.sh
      runas: testcase
      timeout: 300

  AfterInstall:
    - location: scripts/wait_for_approval.sh
      runas: root
      timeout: 300

  ValidateService:
    - location: scripts/deploy_production.sh
      runas: etpmc
      timeout: 300
