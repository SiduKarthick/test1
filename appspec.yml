version: 0.0
os: linux
files:
  - source: /
    destination: /home/testcase/deploy-temp
  - source: scripts/
    destination: /home/testcase/deploy-temp/scripts/
file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: scripts/wait_for_approval.sh
      runas: root
      timeout: 300

  AfterInstall:
    - location: scripts/deploy_staging.sh
      runas: testcase
      timeout: 300

  ApplicationStart:
    - location: scripts/deploy_production.sh
      runas: etpmc
      timeout: 300
